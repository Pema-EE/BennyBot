<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .bg { fill: #111821; }
      .panel { fill: #2d2f35; stroke: #4d5259; stroke-width: 2; }
      .label { font: 700 18px 'Segoe UI', sans-serif; fill: #e7ebf0; }
      .small { font: 600 14px 'Segoe UI', sans-serif; fill: #e7ebf0; }
      .tiny { font: 600 12px 'Segoe UI', sans-serif; fill: #dfe5eb; }
      .wire12 { stroke: #ff6a5f; stroke-width: 5; fill: none; }
      .wireGnd { stroke: #b4b4b4; stroke-width: 5; fill: none; }
      .wireSig { stroke: #7a5cff; stroke-width: 5; fill: none; }
      .wireM { stroke: #d18b43; stroke-width: 5; fill: none; }
      .box { fill: #3b3d42; stroke: #7a7d83; stroke-width: 2; }
      .driver { fill: #1f7e78; stroke: #5dc5b8; stroke-width: 2; }
      .esp { fill: #3e5ab6; stroke: #7aa8ff; stroke-width: 2; }
      .buck { fill: #9b5a1f; stroke: #d19956; stroke-width: 2; }
      .motor { fill: #7a7d82; stroke: #a6abb2; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>

  <!-- Top power rail -->
  <line class="wire12" x1="160" y1="130" x2="470" y2="130"/>
  <line class="wire12" x1="770" y1="130" x2="1010" y2="130"/>
  <line class="wire12" x1="470" y1="130" x2="470" y2="230"/>
  <line class="wire12" x1="770" y1="130" x2="770" y2="230"/>
  <line class="wire12" x1="1010" y1="130" x2="1010" y2="235"/>

  <!-- Ground rail -->
  <line class="wireGnd" x1="160" y1="230" x2="470" y2="230"/>
  <line class="wireGnd" x1="770" y1="230" x2="1010" y2="230"/>
  <line class="wireGnd" x1="470" y1="230" x2="470" y2="525"/>
  <line class="wireGnd" x1="770" y1="230" x2="770" y2="525"/>

  <!-- Battery -->
  <rect class="panel" x="70" y="100" width="120" height="160" rx="8"/>
  <text class="label" x="130" y="160" text-anchor="middle">Battery</text>
  <text class="small" x="130" y="200" text-anchor="middle">Fuse + switch</text>

  <!-- Motor left -->
  <rect class="motor" x="70" y="350" width="120" height="120" rx="8"/>
  <text class="label" x="130" y="405" text-anchor="middle">Motor L</text>

  <!-- Motor right -->
  <rect class="motor" x="1010" y="350" width="120" height="120" rx="8"/>
  <text class="label" x="1070" y="405" text-anchor="middle">Motor R</text>

  <!-- Left driver -->
  <rect class="driver" x="300" y="275" width="270" height="180" rx="12"/>
  <text class="label" x="435" y="350" text-anchor="middle">TMC2209</text>
  <text class="small" x="435" y="385" text-anchor="middle">left motor</text>

  <!-- Right driver -->
  <rect class="driver" x="630" y="275" width="270" height="180" rx="12"/>
  <text class="label" x="765" y="350" text-anchor="middle">TMC2209</text>
  <text class="small" x="765" y="385" text-anchor="middle">right motor</text>

  <!-- ESP32 -->
  <rect class="esp" x="410" y="470" width="380" height="120" rx="12"/>
  <text class="label" x="600" y="520" text-anchor="middle">ESP32</text>
  <text class="small" x="600" y="552" text-anchor="middle">3V3 to IMU and driver VIO</text>

  <!-- Buck converter -->
  <rect class="buck" x="960" y="470" width="170" height="120" rx="12"/>
  <text class="label" x="1045" y="520" text-anchor="middle">Buck</text>
  <text class="small" x="1045" y="552" text-anchor="middle">12V to 5V</text>

  <!-- Caps -->
  <rect class="box" x="265" y="165" width="145" height="45" rx="8"/>
  <rect class="box" x="520" y="165" width="145" height="45" rx="8"/>
  <text class="small" x="337" y="194" text-anchor="middle">100µF</text>
  <text class="small" x="592" y="194" text-anchor="middle">100µF</text>

  <!-- Control and power labels -->
  <text class="tiny" x="820" y="120" text-anchor="start">+12V</text>
  <text class="tiny" x="820" y="245" text-anchor="start">GND</text>
  <text class="tiny" x="330" y="120" text-anchor="start">+12V</text>
  <text class="tiny" x="330" y="245" text-anchor="start">GND</text>

  <!-- Motor enable wires -->
  <line class="wireSig" x1="440" y1="455" x2="440" y2="630"/>
  <line class="wireSig" x1="760" y1="455" x2="760" y2="630"/>
  <text class="tiny" x="415" y="640" text-anchor="start">STEP DIR EN</text>
  <text class="tiny" x="730" y="640" text-anchor="start">STEP DIR EN</text>

  <!-- IMU block -->
  <rect class="box" x="90" y="500" width="200" height="110" rx="8"/>
  <text class="label" x="190" y="545" text-anchor="middle">IMU</text>
  <text class="small" x="190" y="570" text-anchor="middle">on cable</text>

  <!-- I2C line -->
  <line class="wireSig" x1="290" y1="555" x2="410" y2="555"/>
  <text class="tiny" x="310" y="545" text-anchor="start">I2C</text>

  <!-- Ground to ESP -->
  <line class="wireGnd" x1="600" y1="590" x2="600" y2="660"/>

  <!-- Motor power line from battery to drivers -->
  <line class="wire12" x1="190" y1="120" x2="190" y2="190"/>
  <line class="wire12" x1="190" y1="190" x2="300" y2="190"/>
  <line class="wire12" x1="300" y1="190" x2="300" y2="275"/>
  <line class="wire12" x1="700" y1="190" x2="700" y2="275"/>
  <line class="wire12" x1="700" y1="190" x2="960" y2="190"/>

  <!-- Ground to drivers -->
  <line class="wireGnd" x1="190" y1="230" x2="190" y2="260"/>
  <line class="wireGnd" x1="190" y1="260" x2="300" y2="260"/>
  <line class="wireGnd" x1="300" y1="260" x2="300" y2="455"/>
  <line class="wireGnd" x1="700" y1="260" x2="700" y2="455"/>
  <line class="wireGnd" x1="700" y1="260" x2="960" y2="260"/>

  <!-- Legend -->
  <g transform="translate(220,630)">
    <text class="small" x="0" y="0">+12V</text>
    <line class="wire12" x1="80" y1="-6" x2="130" y2="-6"/>
    <text class="small" x="170" y="0">GND</text>
    <line class="wireGnd" x1="250" y1="-6" x2="300" y2="-6"/>
    <text class="small" x="340" y="0">Logic signals</text>
    <line class="wireSig" x1="470" y1="-6" x2="520" y2="-6"/>
    <text class="small" x="560" y="0">Motor coils</text>
    <line class="wireM" x1="675" y1="-6" x2="725" y2="-6"/>
    <text class="small" x="770" y="0">5V</text>
    <line class="wire12" x1="820" y1="-6" x2="870" y2="-6" opacity="0.8"/>
  </g>
</svg>
